name: mdlqa-deb12-postgresql
services:
  postgresql:
    image: docker.io/bitnami/postgresql:17
    restart: always
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      #- ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_USERNAME=bn_moodle
      - POSTGRESQL_PASSWORD=moodlepassword
      - POSTGRESQL_DATABASE=bitnami_moodle
#      - POSTGRESQL_CHARACTER_SET=utf8mb4
#      - POSTGRESQL_COLLATE=utf8mb4_unicode_ci
    volumes:
      - 'postgresql_data:/bitnami/postgresql'
    networks:
      - moodle_network
  moodle:
    #image: docker.io/bitnami/moodle:4.4
    build:
        context: .
        dockerfile: Dockerfile
    restart: always
    ports:
      - '80:8080'
      - '443:8443'
    environment:
      - MOODLE_DATABASE_HOST=postgresql
      - MOODLE_DATABASE_TYPE=pgsql
      - MOODLE_DATABASE_PORT_NUMBER=5432
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_DATABASE_PASSWORD=moodlepassword
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      #- ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - 'moodle_data:/bitnami/moodle'
      - 'moodledata_data:/bitnami/moodledata'
    depends_on:
      - postgresql
    networks:
      - moodle_network
volumes:
  postgresql_data:
    driver: local
  moodle_data:
    driver: local
  moodledata_data:
    driver: local
networks:
  moodle_network:
    driver: bridge
