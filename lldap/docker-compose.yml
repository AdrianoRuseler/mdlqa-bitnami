
volumes:
  lldap_data:
    driver: local

services:
  lldap:
    image: lldap/lldap:stable
    container_name: lldap
    restart: unless-stopped
    ports:
      - "17170:17170" # Web UI
      # - "3890:3890" # LDAP (uncomment if needed, but consider security)
      # - "6360:6360" # LDAPS (uncomment if LDAPS enabled)
    volumes:
      - lldap_data:/data
      # Alternatively, for local folder:
      # - ./lldap_data:/data
    environment:
      # --- Essential Configuration ---
      - LLDAP_JWT_SECRET=YOUR_SUPER_SECRET_JWT_KEY # Change this! Generate a strong random string.
      - LLDAP_LDAP_USER_PASS=YOUR_ADMIN_PASSWORD # Change this!
      - LLDAP_LDAP_BASE_DN=dc=example,dc=com # Your base DN (e.g., dc=yourdomain,dc=com)

      # --- Optional Configuration ---
      # User and Group IDs for the LLDAP process (defaults to 1000)
      - UID=1000
      - GID=1000
      # Timezone
      - TZ=America/Sao_Paulo # Adjust to your timezone

      # LDAPS Options (uncomment and configure if enabling LDAPS)
      # - LLDAP_LDAPS_OPTIONS__ENABLED=true
      # - LLDAP_LDAPS_OPTIONS__CERT_FILE=/data/cert.pem
      # - LLDAP_LDAPS_OPTIONS__KEY_FILE=/data/key.pem

      # SMTP Options for Password Reset (uncomment and configure if needed)
      # - LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET=true
      # - LLDAP_SMTP_OPTIONS__SERVER=smtp.example.com
      # - LLDAP_SMTP_OPTIONS__PORT=587
      # - LLDAP_SMTP_OPTIONS__USER=no-reply@example.com
      # - LLDAP_SMTP_OPTIONS__PASSWORD=YOUR_SMTP_PASSWORD
      # - LLDAP_SMTP_OPTIONS__FROM="LLDAP Admin <no-reply@example.com>"

      # External Database (uncomment and configure if not using SQLite default)
      # - LLDAP_DATABASE_URL=mysql://mysql-user:password@mysql-server/my-database
      # - LLDAP_DATABASE_URL=postgres://postgres-user:password@postgres-server/my-database